<!doctype html>
<!-- The share picture (og-image.png, 1200x630). Rebuild with tools/og-image.sh (headless Chrome screenshot). -->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Figtree:wght@500;700;800&family=Marcellus&family=Noto+Sans+Bengali:wght@600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; font-family: Figtree, sans-serif; color: #eef1fb;
    background: radial-gradient(circle at 82% 42%, rgba(242,198,109,.22), transparent 30%), linear-gradient(180deg, #0b1028, #18224f); }
  .stars { position: absolute; inset: 0; background-image:
    radial-gradient(1.5px 1.5px at 640px 60px, #fff8, transparent), radial-gradient(1.5px 1.5px at 720px 150px, #fff6, transparent),
    radial-gradient(2px 2px at 1120px 70px, #fff9, transparent), radial-gradient(1.5px 1.5px at 1160px 520px, #fff7, transparent),
    radial-gradient(1.5px 1.5px at 760px 560px, #fff6, transparent), radial-gradient(2px 2px at 860px 40px, #fff8, transparent),
    radial-gradient(1.5px 1.5px at 40px 40px, #fff6, transparent), radial-gradient(1.5px 1.5px at 560px 30px, #fff7, transparent),
    radial-gradient(1.5px 1.5px at 1050px 600px, #fff6, transparent), radial-gradient(2px 2px at 700px 470px, #fff5, transparent); }
  .txt { position: absolute; left: 80px; top: 70px; width: 760px; }
  .name { font: 128px/1 Marcellus, serif; color: #f2c66d; margin: 0; }
  .name small { font: 600 44px "Noto Sans Bengali", sans-serif; color: #a6b0d3; margin-left: 18px; vertical-align: middle; }
  h1 { font-weight: 800; font-size: 54px; line-height: 1.15; margin: 26px 0 14px; }
  .sub { font-size: 24px; color: #a6b0d3; margin: 0 0 6px; }
  .as { font: 600 31px/1.5 "Noto Sans Bengali", sans-serif; margin: 0; }
  .pill { position: absolute; left: 80px; bottom: 62px; display: flex; gap: 26px; align-items: center; }
  .pill b { background: #f2c66d; color: #1b1300; font-size: 30px; padding: 14px 32px; border-radius: 99px; }
  .pill span { color: #5fd3bb; font-size: 27px; font-weight: 700; }
  .emblem { position: absolute; right: 90px; top: 110px; width: 260px; height: 260px; color: #f2c66d; }
  .ayah { position: absolute; right: 70px; top: 400px; width: 300px; text-align: center; font: 40px/1.6 "Amiri Quran", serif; color: #fbf4e2; direction: rtl; }
</style>
</head>
<body>
<div class="stars"></div>
<div class="txt">
  <p class="name">Noor<small>নূৰ</small></p>
  <h1>Recite the Quran fluently.<br>Understand every word.</h1>
  <p class="sub">Word by word · Assamese &amp; English translation · Recite &amp; check</p>
  <p class="as">কোৰআন সাৱলীলভাৱে পঢ়ক, প্ৰতিটো শব্দ বুজক</p>
</div>
<svg class="emblem" viewBox="0 0 40 40" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.3"><rect x="9" y="9" width="22" height="22" rx="1.5"/><rect x="9" y="9" width="22" height="22" rx="1.5" transform="rotate(45 20 20)"/></g><circle cx="20" cy="20" r="4.5" fill="currentColor"/></svg>
<div class="ayah">ٱقْرَأْ بِٱسْمِ رَبِّكَ</div>
<div class="pill"><b>smahfuzm.in/quran-noor</b><span>Free to read · 114 surahs</span></div>
</body>
</html>
