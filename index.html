<script>
  /* apply saved theme and language before first paint */
  try {
    var s = JSON.parse(localStorage.getItem('noor.settings') || '{}'), l = JSON.parse(localStorage.getItem('noor.lang') || 'null');
    document.documentElement.dataset.theme = s.theme || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'night');
    if (l) document.documentElement.lang = l === 'en' ? 'en' : 'as';
  } catch (e) {}
</script>

  </a>
  <nav class="nav" aria-label="Main">
    <a href="#/learn" id="navLearn" class="navlink">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6c-2-1.5-5.5-2-8-1v13c2.5-1 6-.5 8 1 2-1.5 5.5-2 8-1V5c-2.5-1-6-.5-8 1z"/><path d="M12 6v13"/></svg>
      <span class="nl">Learn to read</span>
    </a>
    <a href="#/progress" id="navProgress" class="navlink">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      <span class="nl">Progress</span>
    </a>
    <a href="#/saved" id="navSaved" class="navlink">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5h12v17l-6-4.4-6 4.4z"/></svg>

    <div class="seg lang" id="langSwitch" role="group" aria-label="Language">
      <button data-lang="as" lang="as" aria-pressed="true">অসমীয়া</button>
      <button data-lang="en" lang="en" aria-pressed="false">EN</button>
    </div>
    <button id="themeBtn" class="icon-btn" aria-label="Switch light / dark">
      <svg class="i-sun" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
    </button>
  </nav>
</header>

<main id="app" tabindex="-1"></main>

<!-- Timer pill (timed recitation) -->
<div id="timerPill" class="timer-pill" hidden role="status">
  <span class="dot" aria-hidden="true"></span><span id="timerText">0:00.0</span>
  <button id="timerStop" class="btn gold sm">Stop</button>
</div>

<!-- Player -->
<div id="player" class="player" hidden>
  <div class="pbar"><i id="pfill"></i></div>
  <div class="prow">
    <div class="pmain">
      <button class="icon-btn" id="pPrev" aria-label="Previous verse">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
      </button>
      <button class="play-btn" id="pPlay" aria-label="Play or pause" data-state="play">
        <svg class="i-play" viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true"><path d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z"/></svg>
      </button>
      <button class="icon-btn" id="pNext" aria-label="Next verse">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>
      </button>
      <div class="plabel"><b id="pTitle">—</b><span id="pSub"></span></div>
    </div>
    <div class="popts">
      <div class="speed">
        <button id="spDown" aria-label="Slower">−</button><b id="spVal" aria-live="polite">1×</b><button id="spUp" aria-label="Faster">+</button>
      </div>
      <button class="chip" id="pRepeat">Repeat 1×</button>
      <button class="chip" id="pEcho" aria-pressed="false">Echo</button>
      <button class="chip" id="pSolo" aria-pressed="false">Solo</button>
    </div>
  </div>
</div>

<div id="tip" class="tip" hidden></div>
<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast" hidden role="status" aria-live="polite"></div>
